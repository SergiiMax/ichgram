server {
  listen 80;
  server_name _;

  return 301 https://ichgram.duckdns.org$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ichgram.duckdns.org;

  ssl_certificate /etc/letsencrypt/live/ichgram.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ichgram.duckdns.org/privkey.pem;

  include /etc/nginx/snippets/app.conf;
}
